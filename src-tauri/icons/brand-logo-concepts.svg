<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2500" viewBox="0 0 2400 2500" role="img" aria-labelledby="title desc">
  <title id="title">ContextSphere and ChronoDesk logo concepts</title>
  <desc id="desc">Eight premium minimal logo concepts with dock icon, app icon, light and dark versions, wordmark, symbol, menu bar icon, and favicon simulations.</desc>
  <defs>
    <style>
      :root{--black:#000;--near:#111317;--white:#fff;--blue:#1e90ff;--muted:#6b7280;--paper:#f7f8fa;--line:#d9dde5}
      text{font-family:Inter,Manrope,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;letter-spacing:-.035em}
      .sheet{fill:var(--black)}.h1{font-size:44px;font-weight:680;fill:var(--white)}.sub{font-size:18px;font-weight:460;fill:#9aa0aa;letter-spacing:-.01em}.head{font-size:16px;font-weight:620;fill:#8a909a;letter-spacing:.04em;text-transform:uppercase}.name{font-size:22px;font-weight:640;fill:var(--white)}.note{font-size:15px;font-weight:450;fill:#8a909a;letter-spacing:-.01em}.card{fill:#08090b;stroke:#1b1d22;stroke-width:1}.panelLight{fill:var(--paper);stroke:#e5e7eb}.panelDark{fill:#050506;stroke:#1b1d22}.dock{fill:var(--near)}.appDisc{fill:#090a0c;stroke:#1f232b}.bar{fill:#f5f5f7}.faviconBox{fill:var(--near)}.glyph{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.glyphThin{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.fillGlyph{fill:currentColor}.blueStroke{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.blueFill{fill:var(--blue)}.word{font-size:34px;font-weight:650;fill:currentColor}.mono{font-size:12px;font-weight:680;letter-spacing:.08em}.divider{stroke:#1b1d22}.soft{opacity:.72}.tiny{stroke-width:5}.smallText{font-size:13px;fill:#8a909a;letter-spacing:-.01em}
    </style>
    <clipPath id="clip-cs1"><rect x="14" y="17" width="36" height="30" rx="7"/></clipPath>
    <clipPath id="clip-cs3"><rect x="15" y="14" width="34" height="36" rx="8"/></clipPath>
    <clipPath id="clip-cd1"><rect x="14" y="16" width="36" height="31" rx="7"/></clipPath>
    <symbol id="cs-sw" viewBox="0 0 64 64"><rect class="glyph" x="14" y="17" width="36" height="30" rx="7"/><circle class="glyph" clip-path="url(#clip-cs1)" cx="46" cy="32" r="23"/><path class="glyphThin soft" d="M18 25h22"/><circle class="blueFill" cx="45" cy="22" r="3"/></symbol>
    <symbol id="cs-rr" viewBox="0 0 64 64"><rect class="glyph" x="17" y="18" width="30" height="28" rx="7"/><path class="glyph" d="M20 32a18 18 0 0 1 32-11"/><path class="glyph" d="M44 47a18 18 0 0 1-31-10"/><path class="blueStroke" d="M49 19l4 1-1 4"/><circle class="fillGlyph" cx="32" cy="32" r="3"/></symbol>
    <symbol id="cs-ss" viewBox="0 0 64 64"><rect class="glyph" x="15" y="14" width="34" height="36" rx="8"/><circle class="glyph" clip-path="url(#clip-cs3)" cx="42" cy="34" r="20"/><path class="fillGlyph" d="M23 20h11v16l-5.5-3.5L23 36z"/><rect class="blueFill" x="40" y="20" width="5" height="5" rx="1.6"/></symbol>
    <symbol id="cs-ch" viewBox="0 0 64 64"><rect class="glyph" x="14" y="17" width="36" height="30" rx="7"/><path class="glyph" d="M20 38h24"/><path class="glyph" d="M18 38c5-12 23-18 38-10"/><path class="blueStroke" d="M43 29h5"/></symbol>
    <symbol id="cd-sw" viewBox="0 0 64 64"><rect class="glyph" x="14" y="16" width="36" height="31" rx="7"/><circle class="glyph" clip-path="url(#clip-cd1)" cx="20" cy="31" r="23"/><path class="glyph" d="M20 51h24"/><circle class="blueFill" cx="21" cy="22" r="3"/></symbol>
    <symbol id="cd-rr" viewBox="0 0 64 64"><rect class="glyph" x="18" y="19" width="28" height="25" rx="6"/><path class="glyph" d="M32 12a20 20 0 0 1 19 26"/><path class="glyph" d="M32 52a20 20 0 0 1-19-26"/><path class="glyphThin" d="M32 27v8l7 4"/><path class="blueStroke" d="M51 36l-3 4-4-3"/></symbol>
    <symbol id="cd-ss" viewBox="0 0 64 64"><rect class="glyph" x="18" y="14" width="30" height="30" rx="7"/><path class="glyph" d="M14 22h30a7 7 0 0 1 7 7v19H21a7 7 0 0 1-7-7z"/><path class="glyphThin" d="M23 24h14M23 32h9"/><circle class="blueFill" cx="45" cy="43" r="3"/></symbol>
    <symbol id="cd-ch" viewBox="0 0 64 64"><rect class="glyph" x="14" y="16" width="36" height="30" rx="7"/><path class="glyph" d="M16 39h32"/><path class="glyph" d="M22 39c7-11 21-13 32-4"/><path class="glyph" d="M22 51h20"/><circle class="blueFill" cx="47" cy="33" r="2.8"/></symbol>
  </defs>
  <rect class="sheet" width="2400" height="2500"/>
  <text class="h1" x="80" y="78">ContextSphere / ChronoDesk Identity System</text>
  <text class="sub" x="80" y="112">Sphere Window concept family. True black, near black, pure white, and a restrained electric-blue intelligence cue.</text>
  <text class="head" x="80" y="178">Concept</text><text class="head" x="410" y="178">Dock Icon</text><text class="head" x="650" y="178">App Icon</text><text class="head" x="900" y="178">Light Background</text><text class="head" x="1190" y="178">Dark Background</text><text class="head" x="1480" y="178">Wordmark</text><text class="head" x="1790" y="178">Symbol</text><text class="head" x="1985" y="178">Menu Bar</text><text class="head" x="2190" y="178">16px Favicon</text>
  <line class="divider" x1="80" y1="198" x2="2320" y2="198"/>

  <g transform="translate(80 230)">
    <rect class="card" width="2240" height="235" rx="28"/><text class="name" x="30" y="44">ContextSphere</text><text class="note" x="30" y="73">1. Sphere Window</text><text class="smallText" x="30" y="105">A focused workspace frame reveals only part of a larger surrounding context sphere.</text>
    <g transform="translate(330 42)"><rect class="dock" width="150" height="150" rx="34"/><use href="#cs-sw" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(575 42)"><circle class="appDisc" cx="75" cy="75" r="75"/><use href="#cs-sw" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(820 34)"><rect class="panelLight" width="210" height="166" rx="24"/><use href="#cs-sw" x="61" y="39" width="88" height="88" color="#111317"/></g><g transform="translate(1110 34)"><rect class="panelDark" width="210" height="166" rx="24"/><use href="#cs-sw" x="61" y="39" width="88" height="88" color="#fff"/></g><g transform="translate(1400 78)" color="#fff"><use href="#cs-sw" width="58" height="58"/><text class="word" x="74" y="41">ContextSphere</text></g><g transform="translate(1710 72)"><use href="#cs-sw" width="80" height="80" color="#fff"/></g><g transform="translate(1900 63)"><rect class="bar" width="150" height="54" rx="16"/><use href="#cs-sw" x="58" y="12" width="30" height="30" color="#111317"/></g><g transform="translate(2120 61)"><rect class="faviconBox" width="54" height="54" rx="12"/><use href="#cs-sw" x="9" y="9" width="36" height="36" color="#fff"/></g>
  </g>

  <g transform="translate(80 500)">
    <rect class="card" width="2240" height="235" rx="28"/><text class="name" x="30" y="44">ContextSphere</text><text class="note" x="30" y="73">2. Recall Ring</text><text class="smallText" x="30" y="105">A quiet continuity loop surrounds the workspace without becoming a clock, bot, or chat mark.</text>
    <g transform="translate(330 42)"><rect class="dock" width="150" height="150" rx="34"/><use href="#cs-rr" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(575 42)"><circle class="appDisc" cx="75" cy="75" r="75"/><use href="#cs-rr" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(820 34)"><rect class="panelLight" width="210" height="166" rx="24"/><use href="#cs-rr" x="61" y="39" width="88" height="88" color="#111317"/></g><g transform="translate(1110 34)"><rect class="panelDark" width="210" height="166" rx="24"/><use href="#cs-rr" x="61" y="39" width="88" height="88" color="#fff"/></g><g transform="translate(1400 78)" color="#fff"><use href="#cs-rr" width="58" height="58"/><text class="word" x="74" y="41">ContextSphere</text></g><g transform="translate(1710 72)"><use href="#cs-rr" width="80" height="80" color="#fff"/></g><g transform="translate(1900 63)"><rect class="bar" width="150" height="54" rx="16"/><use href="#cs-rr" x="58" y="12" width="30" height="30" color="#111317"/></g><g transform="translate(2120 61)"><rect class="faviconBox" width="54" height="54" rx="12"/><use href="#cs-rr" x="9" y="9" width="36" height="36" color="#fff"/></g>
  </g>

  <g transform="translate(80 770)">
    <rect class="card" width="2240" height="235" rx="28"/><text class="name" x="30" y="44">ContextSphere</text><text class="note" x="30" y="73">3. Saved State</text><text class="smallText" x="30" y="105">A persistent state marker inside the frame signals restored memory, not storage or documents.</text>
    <g transform="translate(330 42)"><rect class="dock" width="150" height="150" rx="34"/><use href="#cs-ss" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(575 42)"><circle class="appDisc" cx="75" cy="75" r="75"/><use href="#cs-ss" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(820 34)"><rect class="panelLight" width="210" height="166" rx="24"/><use href="#cs-ss" x="61" y="39" width="88" height="88" color="#111317"/></g><g transform="translate(1110 34)"><rect class="panelDark" width="210" height="166" rx="24"/><use href="#cs-ss" x="61" y="39" width="88" height="88" color="#fff"/></g><g transform="translate(1400 78)" color="#fff"><use href="#cs-ss" width="58" height="58"/><text class="word" x="74" y="41">ContextSphere</text></g><g transform="translate(1710 72)"><use href="#cs-ss" width="80" height="80" color="#fff"/></g><g transform="translate(1900 63)"><rect class="bar" width="150" height="54" rx="16"/><use href="#cs-ss" x="58" y="12" width="30" height="30" color="#111317"/></g><g transform="translate(2120 61)"><rect class="faviconBox" width="54" height="54" rx="12"/><use href="#cs-ss" x="9" y="9" width="36" height="36" color="#fff"/></g>
  </g>

  <g transform="translate(80 1040)">
    <rect class="card" width="2240" height="235" rx="28"/><text class="name" x="30" y="44">ContextSphere</text><text class="note" x="30" y="73">4. Context Horizon</text><text class="smallText" x="30" y="105">A calm horizon inside the window implies nearby work and offscreen continuity.</text>
    <g transform="translate(330 42)"><rect class="dock" width="150" height="150" rx="34"/><use href="#cs-ch" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(575 42)"><circle class="appDisc" cx="75" cy="75" r="75"/><use href="#cs-ch" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(820 34)"><rect class="panelLight" width="210" height="166" rx="24"/><use href="#cs-ch" x="61" y="39" width="88" height="88" color="#111317"/></g><g transform="translate(1110 34)"><rect class="panelDark" width="210" height="166" rx="24"/><use href="#cs-ch" x="61" y="39" width="88" height="88" color="#fff"/></g><g transform="translate(1400 78)" color="#fff"><use href="#cs-ch" width="58" height="58"/><text class="word" x="74" y="41">ContextSphere</text></g><g transform="translate(1710 72)"><use href="#cs-ch" width="80" height="80" color="#fff"/></g><g transform="translate(1900 63)"><rect class="bar" width="150" height="54" rx="16"/><use href="#cs-ch" x="58" y="12" width="30" height="30" color="#111317"/></g><g transform="translate(2120 61)"><rect class="faviconBox" width="54" height="54" rx="12"/><use href="#cs-ch" x="9" y="9" width="36" height="36" color="#fff"/></g>
  </g>

  <g transform="translate(80 1370)">
    <rect class="card" width="2240" height="235" rx="28"/><text class="name" x="30" y="44">ChronoDesk</text><text class="note" x="30" y="73">1. Sphere Window</text><text class="smallText" x="30" y="105">The same cropped sphere, tuned with a subtle desk baseline for a desktop operating layer.</text>
    <g transform="translate(330 42)"><rect class="dock" width="150" height="150" rx="34"/><use href="#cd-sw" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(575 42)"><circle class="appDisc" cx="75" cy="75" r="75"/><use href="#cd-sw" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(820 34)"><rect class="panelLight" width="210" height="166" rx="24"/><use href="#cd-sw" x="61" y="39" width="88" height="88" color="#111317"/></g><g transform="translate(1110 34)"><rect class="panelDark" width="210" height="166" rx="24"/><use href="#cd-sw" x="61" y="39" width="88" height="88" color="#fff"/></g><g transform="translate(1400 78)" color="#fff"><use href="#cd-sw" width="58" height="58"/><text class="word" x="74" y="41">ChronoDesk</text></g><g transform="translate(1710 72)"><use href="#cd-sw" width="80" height="80" color="#fff"/></g><g transform="translate(1900 63)"><rect class="bar" width="150" height="54" rx="16"/><use href="#cd-sw" x="58" y="12" width="30" height="30" color="#111317"/></g><g transform="translate(2120 61)"><rect class="faviconBox" width="54" height="54" rx="12"/><use href="#cd-sw" x="9" y="9" width="36" height="36" color="#fff"/></g>
  </g>

  <g transform="translate(80 1640)">
    <rect class="card" width="2240" height="235" rx="28"/><text class="name" x="30" y="44">ChronoDesk</text><text class="note" x="30" y="73">2. Recall Ring</text><text class="smallText" x="30" y="105">A restrained temporal ring links work state and time without becoming a generic clock app.</text>
    <g transform="translate(330 42)"><rect class="dock" width="150" height="150" rx="34"/><use href="#cd-rr" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(575 42)"><circle class="appDisc" cx="75" cy="75" r="75"/><use href="#cd-rr" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(820 34)"><rect class="panelLight" width="210" height="166" rx="24"/><use href="#cd-rr" x="61" y="39" width="88" height="88" color="#111317"/></g><g transform="translate(1110 34)"><rect class="panelDark" width="210" height="166" rx="24"/><use href="#cd-rr" x="61" y="39" width="88" height="88" color="#fff"/></g><g transform="translate(1400 78)" color="#fff"><use href="#cd-rr" width="58" height="58"/><text class="word" x="74" y="41">ChronoDesk</text></g><g transform="translate(1710 72)"><use href="#cd-rr" width="80" height="80" color="#fff"/></g><g transform="translate(1900 63)"><rect class="bar" width="150" height="54" rx="16"/><use href="#cd-rr" x="58" y="12" width="30" height="30" color="#111317"/></g><g transform="translate(2120 61)"><rect class="faviconBox" width="54" height="54" rx="12"/><use href="#cd-rr" x="9" y="9" width="36" height="36" color="#fff"/></g>
  </g>

  <g transform="translate(80 1910)">
    <rect class="card" width="2240" height="235" rx="28"/><text class="name" x="30" y="44">ChronoDesk</text><text class="note" x="30" y="73">3. Saved State</text><text class="smallText" x="30" y="105">Overlapping windows create a restored workspace snapshot with a single intelligent blue anchor.</text>
    <g transform="translate(330 42)"><rect class="dock" width="150" height="150" rx="34"/><use href="#cd-ss" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(575 42)"><circle class="appDisc" cx="75" cy="75" r="75"/><use href="#cd-ss" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(820 34)"><rect class="panelLight" width="210" height="166" rx="24"/><use href="#cd-ss" x="61" y="39" width="88" height="88" color="#111317"/></g><g transform="translate(1110 34)"><rect class="panelDark" width="210" height="166" rx="24"/><use href="#cd-ss" x="61" y="39" width="88" height="88" color="#fff"/></g><g transform="translate(1400 78)" color="#fff"><use href="#cd-ss" width="58" height="58"/><text class="word" x="74" y="41">ChronoDesk</text></g><g transform="translate(1710 72)"><use href="#cd-ss" width="80" height="80" color="#fff"/></g><g transform="translate(1900 63)"><rect class="bar" width="150" height="54" rx="16"/><use href="#cd-ss" x="58" y="12" width="30" height="30" color="#111317"/></g><g transform="translate(2120 61)"><rect class="faviconBox" width="54" height="54" rx="12"/><use href="#cd-ss" x="9" y="9" width="36" height="36" color="#fff"/></g>
  </g>

  <g transform="translate(80 2180)">
    <rect class="card" width="2240" height="235" rx="28"/><text class="name" x="30" y="44">ChronoDesk</text><text class="note" x="30" y="73">4. Context Horizon</text><text class="smallText" x="30" y="105">The desk plane and sphere horizon form a calm, premium mark for taskbar and menu contexts.</text>
    <g transform="translate(330 42)"><rect class="dock" width="150" height="150" rx="34"/><use href="#cd-ch" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(575 42)"><circle class="appDisc" cx="75" cy="75" r="75"/><use href="#cd-ch" x="31" y="31" width="88" height="88" color="#fff"/></g><g transform="translate(820 34)"><rect class="panelLight" width="210" height="166" rx="24"/><use href="#cd-ch" x="61" y="39" width="88" height="88" color="#111317"/></g><g transform="translate(1110 34)"><rect class="panelDark" width="210" height="166" rx="24"/><use href="#cd-ch" x="61" y="39" width="88" height="88" color="#fff"/></g><g transform="translate(1400 78)" color="#fff"><use href="#cd-ch" width="58" height="58"/><text class="word" x="74" y="41">ChronoDesk</text></g><g transform="translate(1710 72)"><use href="#cd-ch" width="80" height="80" color="#fff"/></g><g transform="translate(1900 63)"><rect class="bar" width="150" height="54" rx="16"/><use href="#cd-ch" x="58" y="12" width="30" height="30" color="#111317"/></g><g transform="translate(2120 61)"><rect class="faviconBox" width="54" height="54" rx="12"/><use href="#cd-ch" x="9" y="9" width="36" height="36" color="#fff"/></g>
  </g>
  <text class="sub" x="80" y="2470">Recommended direction: ContextSphere Sphere Window for the product mark; ChronoDesk Context Horizon if the app remains time/workspace oriented.</text>
</svg>
